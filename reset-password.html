<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Tranzit.ug</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8f6;
      color: #123c27;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
      background: white;
    }

    .logo {
      font-size: 34px;
      font-weight: bold;
      color: #0b3d25;
    }

    .logo span {
      color: #a55b22;
    }

    main {
      max-width: 520px;
      margin: 70px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 34px;
    }

    p {
      line-height: 1.5;
      color: #456052;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-top: 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #0b3d25;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #123c27;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">tranzit<span>.ug</span></div>
</header>

<main>
  <div class="card">

    <h1>Reset your password</h1>

    <p>
      Enter a new password for your Tranzit account.
    </p>

    <input
      type="password"
      id="newPassword"
      placeholder="New password"
    >

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm new password"
    >

    <button type="button" onclick="updatePassword()">
      Update Password
    </button>

    <a class="back" href="account.html">
      ← Back to Log In
    </a>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =
    'https://mvqzrkaxuthhkicc1faf.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_8iaoevUboXIPBkja1GvozA_SCI5-m8f';

  const supabaseClient =
    supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


  async function updatePassword() {



    const password =
      document.getElementById('newPassword').value;

    const confirmPassword =
      document.getElementById('confirmPassword').value;

    if (!password || !confirmPassword) {
      alert("Please enter and confirm your new password.");
      return;
    }

    if (password.length < 6) {
      alert("Password must be at least 6 characters.");
      return;
    }

    if (password !== confirmPassword) {
      alert("Passwords do not match.");
      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) {
      alert("Password reset failed: " + error.message);
      return;
    }

    alert("Password updated successfully!");
    window.location.href = "account.html";
  }
</script>

</body>
</html>
