<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Tranzit.ug</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f8f6; color: #123c27; }
    header { background: white; padding: 20px; border-bottom: 1px solid #ddd; }
    .logo { font-size: 28px; font-weight: 900; text-decoration: none; color: #123c27; }
    .logo span { color: #ef7f2d; }
    main { max-width: 480px; margin: 35px auto; padding: 20px; }
    .card { background: white; padding: 28px 22px; border-radius: 20px; box-shadow: 0 5px 25px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    button { width: 100%; padding: 15px; margin-top: 12px; border: 0; border-radius: 10px; background: #123c27; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    .error { color: #c0392b; margin-top: 12px; display: none; }
    .success { color: #0d6b3c; margin-top: 12px; display: none; }
  </style>
</head>
<body>
<header>
  <a class="logo" href="index.html">tranzit<span>.ug</span></a>
</header>

<main>
  <div class="card">
    <h1>Set New Password</h1>
    <p>Enter your new password below.</p>

    <input id="password" type="password" placeholder="New password (min 6 characters)">
    <input id="confirmPassword" type="password" placeholder="Confirm new password">

    <button onclick="updatePassword()">Update Password</button>
    <div id="errorMsg" class="error"></div>
    <div id="successMsg" class="success"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mvqzrkaxuthhkicclfaf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8iaoevUboXIPBkja1GvozA_SCI5-m8f';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function updatePassword() {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');

    errorMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (password.length < 6) {
      errorMsg.textContent = 'Password must be at least 6 characters.';
      errorMsg.style.display = 'block';
      return;
    }
    if (password !== confirmPassword) {
      errorMsg.textContent = 'Passwords do not match.';
      errorMsg.style.display = 'block';
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
      return;
    }

    successMsg.textContent = 'Password updated successfully! You can now log in.';
    successMsg.style.display = 'block';

    setTimeout(() => {
      window.location.href = 'account.html';
    }, 2000);
  }
</script>
</body>
</html>
