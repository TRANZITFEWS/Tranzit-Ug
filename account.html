<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Tranzit.ug</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f7f8f6; color: #123c27; }
    header { background: white; padding: 20px; border-bottom: 1px solid #ddd; }
    .logo { font-size: 28px; font-weight: 900; text-decoration: none; color: #123c27; }
    .logo span { color: #ef7f2d; }
    main { max-width: 480px; margin: 35px auto; padding: 20px; }
    .card { background: white; padding: 28px 22px; border-radius: 20px; box-shadow: 0 5px 25px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ccc; border-radius: 10px; font-size: 16px; }
    button { width: 100%; padding: 15px; margin-top: 12px; border: 0; border-radius: 10px; background: #123c27; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    .signup { background: #ef7f2d; }
    .back { display: block; margin-top: 22px; text-align: center; color: #123c27; }
    .error { color: #c0392b; margin-top: 12px; display: none; }
    .user-info { display: none; }
    .login-form { display: block; }
  </style>
</head>
<body>
<header>
  <a class="logo" href="index.html">tranzit<span>.ug</span></a>
</header>

<main>
  <div class="card">
    <!-- Login form -->
    <div id="loginForm" class="login-form">
      <h1>Welcome to Tranzit</h1>
      <p>Log in to manage your account, orders and marketplace activity.</p>

      <input id="email" type="email" placeholder="Email address">
      <input id="password" type="password" placeholder="Password">

      <button onclick="loginUser()">Log In</button>
      <button onclick="resetPassword()" style="background:#666; margin-top:8px;">Forgot Password?</button>
      <button class="signup" onclick="window.location.href='register.html'">Create Account</button>
      <div id="errorMsg" class="error"></div>
    </div>

    <!-- Logged-in view -->
    <div id="userInfo" class="user-info">
      <h1>My Account</h1>
      <p id="welcomeText"></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
            <h2>My Orders</h2>
      <div id="myOrders"></div>
      <button onclick="logoutUser()" style="background:#c0392b;">Log Out</button>
      <a class="back" href="index.html">← Back to marketplace</a>
    </div>

    <a class="back" href="index.html" id="backLink">← Back to marketplace</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mvqzrkaxuthhkicclfaf.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8iaoevUboXIPBkja1GvozA_SCI5-m8f';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Check if already logged in
  async function checkUser() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (user) {
      showLoggedIn(user);
    }
  }

  function showLoggedIn(user) {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('userInfo').style.display = 'block';
    document.getElementById('backLink').style.display = 'none';
    document.getElementById('welcomeText').textContent = 'You are logged in.';
    document.getElementById('userEmail').textContent = user.email;
        loadMyOrders(user.id);
  }

  async function loginUser() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (!email || !password) {
      errorMsg.textContent = 'Please enter email and password.';
      errorMsg.style.display = 'block';
      return;
    }

    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
      return;
    }

    showLoggedIn(data.user);
  }

  async function resetPassword() {
    const email = document.getElementById('email').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.display = 'none';

    if (!email) {
      errorMsg.textContent = 'Please enter your email first.';
      errorMsg.style.display = 'block';
      return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: 'https://tranzit.ug/reset-password.html'
    });

    if (error) {
      errorMsg.textContent = error.message;
      errorMsg.style.display = 'block';
      return;
    }

    alert('Password reset email sent! Check your inbox.');
  }

  async function logoutUser() {
    await supabaseClient.auth.signOut();
    window.location.reload();
  }
  async function loadMyOrders(userId) {
    const box = document.getElementById('myOrders');
    if (!box) return;

    const { data, error } = await supabaseClient
      .from('orders')
      .select('*, order_items(*)')
      .eq('buyer_id', userId)
      .order('created_at', { ascending: false });

    if (error) {
      box.innerHTML = '<p>' + error.message + '</p>';
      return;
    }

    if (!data || data.length === 0) {
      box.innerHTML = '<p>No orders yet.</p>';
      return;
    }

    box.innerHTML = data.map(o => {
      const items = (o.order_items || [])
        .map(i => i.product_name + ' x' + i.quantity)
        .join(', ');
      const claim = o.payment_status === 'paid'
        ? 'Paid'
        : o.buyer_paid
          ? 'Waiting for seller to confirm'
          : `<button onclick="claimPaid('${o.id}')">I have paid</button>`;
      return `<p><b>Order ${String(o.id).slice(0, 8).toUpperCase()}</b><br><b>${items}</b><br>UGX ${Number(o.total).toLocaleString()} • ${o.status}<br>${o.buyer_location || ''}<br>${claim}</p>`;
    }).join('');
  }
    async function claimPaid(id) {
    const { error } = await supabaseClient
      .from('orders')
      .update({ buyer_paid: true })
      .eq('id', id);
    if (error) {
      alert(error.message);
      return;
    }
    alert('Payment sent to the seller for confirmation.');
    const { data } = await supabaseClient.auth.getUser();
    if (data.user) loadMyOrders(data.user.id);
  }
  checkUser();
</script>
</body>
</html>
