<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Tranzit.ug</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8f6;
      color: #123c27;
    }

    header {
      background: white;
      padding: 20px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      text-decoration: none;
      color: #123c27;
    }

    .logo span { color: #ef7f2d; }

    main {
      max-width: 480px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 28px 22px;
      border-radius: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 { margin-top: 0; }

    input {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 0;
      border-radius: 10px;
      background: #123c27;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .signup {
      background: #ef7f2d;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #123c27;
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="index.html">tranzit<span>.ug</span></a>
</header>

<main>
  <div class="card">
    <h1>Welcome to Tranzit</h1>
    <p>Log in to manage your account, orders and marketplace activity.</p>

    <input type="email" placeholder="Email address">
    <input type="password" placeholder="Password">

    <button type="button">Log In</button>
    <button type="button" class="signup">Create Account</button>

    <a class="back" href="index.html">← Back to marketplace</a>
  </div>
</main>

</body>
</html>
