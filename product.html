<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Tranzit.ug</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a class="brand" href="index.html">tranzit<span>.ug</span></a>
  <div class="actions">
    <button onclick="window.location.href='index.html'">← Back</button>
    <button id="cartBtn">🛒 Cart <b id="cartCount">0</b></button>
  </div>
</header>

<main>
  <section id="productDetails">
    <p>Loading product...</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = 'https://mvqzrkaxuthhkicclfaf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8iaoevUboXIPBkja1GvozA_SCI5-m8f';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadProduct() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const container = document.getElementById('productDetails');

  if (!id) {
    container.innerHTML = '<p>Product not found.</p>';
    return;
  }

  const { data: product, error } = await supabaseClient
    .from('products')
    .select('*')
    .eq('id', id)
    .single();

  if (error || !product) {
    container.innerHTML = '<p>Product not found.<br>' + (error ? error.message : 'No id') + '</p>';
    return;
  }

  container.innerHTML = `
    <article class="product-detail">
      ${product.image_url
        ? `<img src="${product.image_url}" alt="${product.name}" style="width:100%;max-height:320px;object-fit:cover;border-radius:16px;">`
        : ''}
      <small>${product.category || 'Other'}</small>
      <h1>${product.name}</h1>
      <h2>UGX ${Number(product.price).toLocaleString()}</h2>
      <p>${product.description || 'No description available.'}</p>
      <p>${product.stock ?? 0} in stock</p>
       <button onclick="addFromPage()" style="width:100%;padding:14px;border:0;border-radius:12px;background:#173f2a;color:#fff;font-weight:800">Add to cart</button>
    </article>
  `;
}
function addFromPage() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const name = document.querySelector('h1').textContent;
  const price = Number(document.querySelector('h2').textContent.replace(/\D/g, ''));
  const saved = JSON.parse(localStorage.getItem('tranzitCart') || '[]');
  const existing = saved.find(x => x.id === id);
  if (existing) existing.qty += 1;
  else saved.push({ id, name, price, icon: '🛒', qty: 1 });
  localStorage.setItem('tranzitCart', JSON.stringify(saved));
  alert('Added to cart');
  location.href = 'index.html';
}
loadProduct();
</script>

</body>
</html>
