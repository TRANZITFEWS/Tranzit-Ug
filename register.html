<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Tranzit.ug</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8f6;
      color: #123c27;
    }

    header {
      background: white;
      padding: 24px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      color: #123c27;
      text-decoration: none;
    }

    .logo span {
      color: #e8873a;
    }

    main {
      padding: 50px 22px;
      display: flex;
      justify-content: center;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 430px;
      padding: 28px;
      border-radius: 24px;
    }

    h1 {
      font-size: 34px;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 17px;
      margin: 8px 0;
      border: 1px solid #bbb;
      border-radius: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: #123c27;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 24px;
    }

    a {
      color: #123c27;
    }
  </style>
</head>

<body>

<header>
  <a class="logo" href="index.html">tranzit<span>.ug</span></a>
</header>

<main>
  <div class="card">

    <h1>Create Account</h1>
    <p>Join Tranzit.ug and start buying and selling across Uganda.</p>

    <input type="text" placeholder="Full name">
    <input type="email" placeholder="Email address">
    <input type="tel" placeholder="Phone number">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm password">

    <button type="button">Create Account</button>

    <div class="login">
      Already have an account?
      <a href="account.html">Log In</a>
    </div>

  </div>
</main>

</body>
</html>
